<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow,noarchive">
<meta http-equiv="Content-Security-Policy" content="default-src 'none';script-src 'unsafe-inline';style-src 'unsafe-inline';connect-src 'self';img-src blob: data:;media-src blob:;object-src 'none';form-action 'none';base-uri 'none'">
<title>Vision Lab · Benchmark V1</title><style>
:root{color-scheme:dark;--bg:#10141e;--panel:#1c2331;--line:#343d50;--ink:#eaf0fc;--sub:#acbbd1;--accent:#b5c8ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}.wrap{width:min(1150px,calc(100% - 28px));margin:auto}
header{padding:22px 0 34px;background:radial-gradient(circle at 100% 0%,#304260,transparent 55%),#171e2b;border-bottom:1px solid var(--line)}
a{color:var(--accent)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;letter-spacing:.06em}
h1{font-size:clamp(34px,7vw,60px);letter-spacing:-.045em;line-height:1.1;margin:44px 0 15px}
header p{color:var(--sub);line-height:1.75;font-size:14px;margin:0;max-width:740px}
.metrics{display:flex;gap:26px;flex-wrap:wrap;margin-top:25px}.metrics b{display:block;font-size:25px}.metrics small{color:var(--sub)}
main{padding:30px 0 65px}.controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:15px}
button,select,textarea,input{font:inherit;color:var(--ink)}.btn{background:#263755;border:1px solid #4e638a;border-radius:9px;padding:10px 13px;font-size:13px;cursor:pointer}.btn.active{background:#a7bfff;color:#122039}
.notice{color:var(--sub);font-size:13px;line-height:1.7;padding:12px 15px;background:#1b2537;border-left:3px solid #6a85bb;margin:20px 0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.card{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.cover{display:block;width:100%;aspect-ratio:4/4.8;object-fit:cover;background:#273144;cursor:pointer}
.card.video .cover{aspect-ratio:16/9;object-fit:contain}
.detail{padding:13px 15px 16px}.detail h3{font-size:15px;line-height:1.4;margin:4px 0 8px}.detail p{font-size:12px;color:var(--sub);line-height:1.45;margin:6px 0}
.badge{color:var(--accent);font-size:11px}.secret{font-size:11px;color:#aab8d4;background:#27344a;padding:9px;border-radius:8px;line-height:1.65;margin-top:10px}
.rating{border-top:1px solid #384455;margin-top:12px;padding-top:12px}
.rating-row{display:grid;grid-template-columns:1fr 85px;gap:8px;align-items:center;margin:8px 0;font-size:12px}
.rating select{background:#162132;border:1px solid #53647d;border-radius:8px;padding:6px 9px}
.rating textarea{resize:vertical;width:100%;min-height:55px;margin-top:7px;border-radius:8px;padding:8px;background:#131b2a;border:1px solid #53647d;font-size:12px}
.saved{font-size:11px;color:#8bc5a2;min-height:15px}.loading{padding:16px;color:var(--sub)}
#viewer{position:fixed;inset:0;background:#06090feb;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:5;padding:10px}
#viewer img{max-height:83vh;max-width:98vw;object-fit:contain}#viewer .bar{display:flex;align-items:center;justify-content:space-between;gap:15px;width:min(850px,100%);padding:12px}
.hidden{display:none!important}#unlock{max-width:570px;margin:45px 0;background:var(--panel);border:1px solid var(--line);padding:22px;border-radius:13px}
#unlock input{width:100%;margin:10px 0;padding:11px;border-radius:8px;border:1px solid #53647d;background:#141c2b}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:580px){.grid{grid-template-columns:1fr}.cover{aspect-ratio:4/4.25}h1{margin-top:35px}.controls{gap:7px}.btn{font-size:12px}}
</style></head><body><header><div class="wrap"><div class="top"><a id="back" href="./">← Vision Lab</a><span>BENCHMARK / V1</span></div>
<h1>给 AI 作品<br>做一次真正的考试。</h1>
<p>固定种子与参数，独立评价角色一致性、动作完成度、视觉质量。默认隐藏实验条件，尽量避免先入为主。评分在你的手机浏览器本地保存。</p>
<div class="metrics"><div><b id="planned">32</b><small>计划样本</small></div><div><b id="produced">—</b><small>已完成生成</small></div><div><b id="rated">0</b><small>已评分</small></div></div></div></header>
<main class="wrap">
<div id="unlock"><b>私人实验室</b><p>请使用包含 #k= 的完整私人链接。</p><input id="secret" placeholder="粘贴私人解锁码"><button class="btn" id="open">解锁评测</button><p id="error" style="color:#ffaaaa"></p></div>
<div id="app" class="hidden"><div class="controls"><button class="btn active" id="all">全部</button><button class="btn" id="images">图片</button><button class="btn" id="videos">视频</button><button class="btn" id="reveal">显示实验条件</button><button class="btn" id="copy">复制评分</button><button class="btn" id="export">导出评分 JSON</button></div>
<div class="notice">请先看图或播放视频，再评分。图片评分：角色还原、姿态遵循、整体质量；视频评分：动作遵循、时间一致性、整体质量。1＝很差，5＝很好。未看过的可以留空。</div>
<div id="cards" class="grid"></div></div></main>
<div id="viewer" class="hidden"><img id="large" alt="大图"><div class="bar"><span id="vlabel"></span><button id="close" class="btn">关闭</button></div></div>
<script>
"use strict";
const $=x=>document.getElementById(x),encode=new TextEncoder(),decode=new TextDecoder();
let key,manifest,mode="all",revealed=false;const cache=new Map(),ratings={};
const storage="vision-bench-v1-ratings";
try{Object.assign(ratings,JSON.parse(localStorage.getItem(storage)||"{}"));}catch(e){}
function kFromFragment(){return new URLSearchParams(location.hash.slice(1)).get("k")||"";}
async function importKey(s){
 s=s.trim();if(s.includes("#k="))s=s.split("#k=")[1].split("&")[0];
 if(!/^[A-Za-z0-9_-]{43}$/.test(s))throw Error("解锁码格式不正确");
 const bin=atob(s.replace(/-/g,"+").replace(/_/g,"/")+"=");
 return crypto.subtle.importKey("raw",Uint8Array.from(bin,c=>c.charCodeAt(0)),"AES-GCM",false,["decrypt"]);
}
async function decrypt(path){
 const r=await fetch(path,{cache:"no-cache"});if(!r.ok)throw Error("加载错误: "+r.status);
 const data=new Uint8Array(await r.arrayBuffer());
 return crypto.subtle.decrypt({name:"AES-GCM",iv:data.slice(0,12),additionalData:encode.encode(path.split("/").pop()),tagLength:128},key,data.slice(12));
}
async function media(path,type){
 if(cache.has(path))return cache.get(path);
 const promise=decrypt(path).then(buf=>URL.createObjectURL(new Blob([buf],{type}))).catch(e=>{cache.delete(path);throw e;});
 cache.set(path,promise);return promise;
}
function el(tag,cls,value){let e=document.createElement(tag);if(cls)e.className=cls;if(value!==undefined)e.textContent=value;return e;}
function save(){try{localStorage.setItem(storage,JSON.stringify(ratings));}catch(e){}updateCounts();}
function updateCounts(){$("rated").textContent=Object.values(ratings).filter(r=>r&&Object.values(r.scores||{}).some(x=>Number(x)>0)).length;}
function ratingExport(){return {version:"vision-benchmark-v1",timestamp:new Date().toISOString(),ratings:Object.entries(ratings).map(([id,v])=>({id,...v}))};}
function getRank(id){if(!ratings[id])ratings[id]={scores:{},note:""};return ratings[id];}
function mediaLazy(node,path,type){
 const observer=new IntersectionObserver(entries=>{
  if(entries[0].isIntersecting){observer.disconnect();media(path,type).then(url=>node.src=url).catch(()=>node.alt="加载失败");}
 },{rootMargin:"230px"});
 observer.observe(node);
}
async function zoom(item){
 try{const src=await media(item.media,"image/png");$("large").src=src;$("vlabel").textContent="样本 "+item.id;$("viewer").classList.remove("hidden");}
 catch(e){alert("图片解密失败："+e.message);}
}
function scoreRow(item,name,label){
 const row=el("div","rating-row");row.append(el("span","",label));
 const select=el("select");select.setAttribute("aria-label",label);
 [["","未评分"],["1","1 · 差"],["2","2"],["3","3 · 中"],["4","4"],["5","5 · 好"]].forEach(([v,t])=>{
  let option=el("option","",t);option.value=v;select.append(option);
 });
 select.value=String(getRank(item.id).scores[name]||"");
 select.addEventListener("change",()=>{const r=getRank(item.id);if(select.value)r.scores[name]=Number(select.value);else delete r.scores[name];save();});
 row.append(select);return row;
}
function card(item){
 const article=el("article","card "+item.kind);
 let mediaBox;
 if(item.status==="passed"){
   mediaBox=el("img","cover");mediaBox.alt=item.id;mediaBox.loading="lazy";
   mediaLazy(mediaBox,item.thumb,"image/webp");
   if(item.kind==="image")mediaBox.onclick=()=>zoom(item);
   else mediaBox.onclick=()=>play(item,mediaBox,article);
 }else{mediaBox=el("div","loading","该项运行失败 / 尚未生成，请查看状态");}
 article.append(mediaBox);
 const body=el("div","detail");
 body.append(el("small","badge",item.kind==="image"?"图片 · 768×1024":"视频 · 832×480"));
 body.append(el("h3","",item.kind==="image"?(item.pose==="action"?"动态姿态":"站姿肖像")+" · 样本 "+item.id.slice(-2):({blink:"眨眼",wave:"挥手",run:"奔跑",push:"运镜推进"}[item.action]||"视频")+" · "+item.id.slice(-2)));
 body.append(el("p","",item.status==="passed"?"真实生成 "+item.seconds+" 秒":"状态："+item.status+(item.error?" / "+item.error.slice(0,90):"")));
 let info=el("div","secret "+(revealed?"":"hidden"),
      item.kind==="image"?"LoRA："+(item.lora?"有":"无")+"；参考图："+(item.reference?"有":"无")+"；种子："+item.seed
                         :"动作："+item.action+"；种子："+item.seed);
 body.append(info);
 if(item.status==="passed"){
   if(item.kind==="video"){
    const btn=el("button","btn","解密并播放视频");btn.addEventListener("click",()=>play(item,mediaBox,article));
    body.append(btn);
   }
   const box=el("div","rating");
   if(item.kind==="image"){
    box.append(scoreRow(item,"identity","角色还原度"));
    box.append(scoreRow(item,"pose","姿态遵循度"));
    box.append(scoreRow(item,"visual","整体视觉质量"));
   }else{
    box.append(scoreRow(item,"motion","动作完成度"));
    box.append(scoreRow(item,"temporal","时序一致性"));
    box.append(scoreRow(item,"visual","整体视觉质量"));
   }
   const note=el("textarea");note.placeholder="变形、错误、值得保留的细节…";note.value=getRank(item.id).note||"";
   note.addEventListener("input",()=>{getRank(item.id).note=note.value;save();});
   box.append(note);body.append(box);
 }
 article.append(body);return article;
}
async function play(item,img,article){
 const btn=article.querySelector("button");if(btn)btn.textContent="正在解密视频…";
 try{
  const u=await media(item.media,"video/mp4");
  let video=article.querySelector("video");
  if(!video){video=el("video","cover");video.controls=true;video.playsInline=true;video.preload="metadata";video.src=u;img.replaceWith(video);}
  video.play().catch(()=>{});if(btn)btn.textContent="播放视频";
 }catch(e){alert("视频解密失败："+e.message);if(btn)btn.textContent="重试";}
}
function render(){
 const items=manifest.items.filter(i=>mode==="all"||i.kind===(mode==="images"?"image":"video"));
 // Stable hidden evaluation ordering; display order independent of LoRA/ref factors.
 items.sort((a,b)=>a.blind_order-b.blind_order);
 $("cards").replaceChildren(...items.map(card));
 $("reveal").textContent=revealed?"隐藏实验条件":"显示实验条件";
 for(const id of ["all","images","videos"])$(id).classList.toggle("active",id===mode);
 updateCounts();
}
async function unlock(token){
 try{
  $("error").textContent="正在解锁…";key=await importKey(token);
  manifest=JSON.parse(decode.decode(await decrypt("bench.bin")));
  $("unlock").classList.add("hidden");$("app").classList.remove("hidden");
  $("produced").textContent=manifest.items.filter(i=>i.status==="passed").length;
  $("back").href="./"+location.hash;
  render();
 }catch(e){$("error").textContent="无法解锁，请使用完整私人链接。";}
}
$("open").onclick=()=>unlock($("secret").value);
$("secret").onkeydown=e=>{if(e.key==="Enter")unlock($("secret").value);};
for(const type of ["all","images","videos"])$(type).onclick=()=>{mode=type;render();};
$("reveal").onclick=()=>{revealed=!revealed;render();};
$("close").onclick=()=>{$("viewer").classList.add("hidden");$("large").src="";};
$("copy").onclick=()=>navigator.clipboard.writeText(JSON.stringify(ratingExport(),null,2)).then(()=>alert("评分已复制，粘贴回 ChatGPT 即可")).catch(()=>alert("复制失败，请使用导出 JSON"));
$("export").onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify(ratingExport(),null,2)],{type:"application/json"}));let a=el("a");a.href=u;a.download="vision-benchmark-v1-ratings.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),5000);};
let fragment=kFromFragment();if(fragment){$("secret").value=fragment;unlock(fragment);}
</script></body></html>
